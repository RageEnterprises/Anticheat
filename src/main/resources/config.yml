# RageAnticheat configuration. Apply changes with /rageanticheat reload.
# Distances are in blocks per move. A vanilla client sends one move per tick (20 per second).

checks:
  flight:
    enabled: true
    # Moves in a row without ground contact before the airtime rule applies (40 = about 2 seconds).
    max-airborne-ticks: 40
    # After max-airborne-ticks, the player must be falling at least this fast or they are flagged.
    min-fall-speed: 0.5
    # How much higher than vanilla gravity predicts a player may move per tick. Raise if laggy players get flagged.
    gravity-tolerance: 0.05

  spider:
    # Climbing a wall without a ladder or vine. Uses the flight gravity settings above.
    enabled: true

  speed:
    enabled: true
    # Free extra distance per move on top of the vanilla prediction. Keep this small: it is added every move.
    tolerance: 0.01
    # Flag when the extra distance over the last <samples> moves adds up to more than this many blocks.
    max-excess: 0.1
    samples: 10

  noslow:
    # Moving at full speed while eating, drinking, blocking with a shield or drawing a bow. Vanilla
    # slows the player to a fifth of their speed. Part of the speed prediction, so it needs speed enabled.
    enabled: true

  jesus:
    # Walking on water or lava.
    enabled: true
    # Moves in a row level on a liquid surface before flagging.
    max-ticks: 10

  step:
    # Stepping up higher than vanilla allows in a single move.
    enabled: true
    # Vanilla step height. Raise if another plugin changes the step_height attribute.
    max-height: 0.6

  nofall:
    # Client claims to be on the ground while falling, to avoid fall damage.
    enabled: true
    # Moves in a row before flagging.
    max-ticks: 3

  timer:
    # Game sped up: more movement packets than real time allows.
    enabled: true
    # Flag when a client runs this many milliseconds ahead of real time.
    max-ahead-ms: 300
    # Idle or lagged time a client may bank to absorb a burst of delayed packets. Lower is stricter.
    max-lag-credit-ms: 1000

  reach:
    # Melee hits from farther away than vanilla allows. Flagged hits are cancelled.
    enabled: true
    # Eye-to-hitbox distance. Vanilla is 3.0; the extra covers ping. Raise for high-ping players.
    max-distance: 3.5

  nuker:
    # Breaking many blocks at once, from too far away, or outside the player's view. Flagged breaks are cancelled.
    enabled: true
    # Vanilla instamining breaks at most one block per tick (20 per second). The extra covers lag bursts.
    max-per-tick: 3
    max-per-second: 22
    # Eye to block centre. Vanilla reach is 4.5 plus up to 0.87 to the centre.
    max-distance: 6.0
    # Largest angle between the crosshair and the block centre, in degrees.
    max-angle: 75

  fastbreak:
    # Mining a block faster than the tool, enchantments and effects allow. Flagged breaks are cancelled.
    enabled: true
    # Flag when a block is mined in less than this share of the vanilla time. Vanilla servers accept
    # 0.7, which is what FastBreak cheats use. Lower this if players with unstable ping get flagged.
    min-ratio: 0.8

  scaffold:
    # Placing blocks against a face the player is not looking at (bridging cheats), or too fast.
    enabled: true
    # Flag after this many look/face mismatches within miss-window-ticks. One miss can be a turn while clicking.
    max-misses: 3
    miss-window-ticks: 60
    # Holding right-click places 5 per second; fast clicking can reach about 15.
    max-per-second: 20

  killaura:
    # Hitting targets outside the crosshair, or many different targets at once. Flagged hits are cancelled.
    enabled: true
    # Extra size added to the target hitbox for the crosshair test. Covers ping and target movement.
    hitbox-expand: 0.5
    # Flag after this many hits outside the crosshair within miss-window-ticks.
    max-misses: 4
    miss-window-ticks: 100
    # Flag when more than this many different targets are hit within switch-window-ticks (10 = half a second).
    max-targets: 3
    switch-window-ticks: 10

  xray:
    # Mining far more hidden ores (not touching air or liquid) per stone than a normal player.
    # Lucky players exist, so by default this only alerts staff. Paper's built-in anti-xray
    # (paper-world-defaults.yml > anticheat.anti-xray) is the best way to stop X-ray itself.
    enabled: true
    # true: add a violation like the other checks (can lead to a kick). false: alert only.
    punish: false
    # Only judge after this many hidden ore veins.
    min-ores: 4
    # Alert when hidden ore veins per stone mined is above this. Branch mining is around 0.003.
    max-ores-per-stone: 0.02
    ores: [DIAMOND_ORE, DEEPSLATE_DIAMOND_ORE, EMERALD_ORE, DEEPSLATE_EMERALD_ORE, ANCIENT_DEBRIS]
    stone: [STONE, DEEPSLATE, TUFF, GRANITE, DIORITE, ANDESITE, NETHERRACK, BASALT, BLACKSTONE]

  autoclicker:
    # Clicks (arm swings) that do not hit a block: too many per second, or too evenly spaced.
    # Holding the mouse on a block swings every tick, so swings aimed at a block are ignored.
    enabled: true
    # Butterfly and drag clicking can reach 20+ clicks per second, so keep this high.
    max-cps: 25
    # Judge the rhythm over this many clicks in a row (pauses longer than 400 ms start over).
    samples: 20
    # Flag when the spacing between clicks varies by less than this (standard deviation, ms).
    # People vary by 20-50 ms; click macros by a few. Network jitter adds some variation for everyone.
    min-deviation-ms: 10
    # Only judge the rhythm while clicking at least this fast.
    min-cps: 8

  crystal:
    # Crystal aura: breaking an end crystal before the client could have seen it spawn (ID
    # prediction), or placing/breaking crystals faster than people can. Flagged actions are cancelled.
    # Crystal hits also get the KillAura crosshair test.
    enabled: true
    max-breaks-per-second: 12
    max-places-per-second: 12

  autototem:
    # Moving a new totem into the off hand right after one pops. Measured from the inventory click
    # packets: time from the pop to the refill click, minus the player's ping. Flagged refills are cancelled.
    enabled: true
    # People need at least 150 ms to see the pop and click; auto-totem cheats need a few.
    min-reaction-ms: 80

  badpackets:
    # Packets the vanilla client never sends, which cheat clients use to fake what the server sees.
    # Pitch beyond straight up or down (silent aim, "derp" and spin bots). Flagged at most once a second.
    invalid-rotation: true
    # Attacking without the arm swing packet that every vanilla attack sends (many kill auras skip it).
    no-swing: true
    # Starting to sprint with 6 food or less, or while blind. Cancelled when flagged.
    impossible-sprint: true

  elytra:
    # ElytraFly. Gliding only trades height for speed and back, so without a firework, knockback or
    # riptide a glider cannot climb above where its height and speed could take it, or hover.
    # Flagged gliders stop gliding.
    enabled: true
    # Horizontal blocks per tick without a boost. Diving and pulling up reaches about 3.
    max-speed: 3.5
    # Blocks of height a glider may gain beyond its energy, for rounding.
    climb-margin: 3
  vehicles:
    # BoatFly (a boat in the air that does not fall) and EntitySpeed (boats and horses too fast).
    # Flagged riders are dismounted and the vehicle is moved back. Camels are skipped (their dash).
    enabled: true
    # Boat blocks per tick off ice (about 0.4 on water) and on ice (blue ice reaches about 3.6).
    max-boat-speed: 1.0
    max-boat-ice-speed: 4.0
    # A horse moves about 2.1 times its speed attribute per tick.
    mount-speed-factor: 2.6
    max-boat-air-moves: 10

grace:
  # Ticks to skip all movement checks after knockback, damage, explosions, or server-applied velocity.
  knockback-ticks: 30
  # Ticks to keep skipping checks after a state that breaks them ends: elytra, riptide, vehicles and flying
  # (all checks); water, ladders, levitation, slow falling, slime blocks and beds (vertical checks).
  boost-ticks: 20

violations:
  # Kick when a player's violation level reaches this.
  kick-threshold: 20
  kick-enabled: true
  # What happens at kick-threshold: kick, or ban (recorded in the player's punishment history).
  action: kick
  # Ban length when action is ban, like 1d, 7d, 30d or perm.
  ban-duration: 7d
  # Violation level removed every second.
  decay-per-second: 0.5

alerts:
  # Send alerts to online players with rageanticheat.alerts. Violations are always logged to the console.
  enabled: true

exploits:
  # Blocks crash exploits: oversized books, creative items with huge NBT data, oversized sign lines.
  enabled: true
  # ban, kick or none (alert only). Bans are recorded in the player's punishment history.
  action: ban
  ban-duration: perm
  # Vanilla limits: 100 pages, 1024 characters per page, 32-character titles.
  max-book-pages: 100
  max-page-chars: 1024
  max-title-chars: 32
  # Largest serialized creative-mode item. A full shulker box of normal items is well under this.
  max-item-bytes: 65536
  # The vanilla client cannot type more than about 90 characters per line; the protocol allows 384.
  max-sign-line-chars: 384

client-mods:
  # Refuse clients that announce a blocked mod, through their client brand or the plugin channels
  # their mods register. Cheat clients can hide both, and freecam leaves no trace on the server at all,
  # so this only stops clients that identify themselves. Players with rageanticheat.mods.bypass are skipped.
  enabled: true
  # kick, ban or none (alert staff only). Kicks are not recorded as punishments.
  action: kick
  ban-duration: perm
  # Only allow the unmodified vanilla client (brand "vanilla"). This also refuses Fabric, Forge,
  # Lunar, Badlion and other launchers, even without cheat mods.
  vanilla-only: false
  # Refuse clients caught faking their brand to hide mods: brand "vanilla" while registering
  # channels only mods register (brand changers leave the mod loader's channels behind), or a
  # brand that changes after joining. Uses the action above.
  detect-spoofing: true
  # Whole words matched in the brand and channel names, case-insensitive.
  blocked: [wurst, meteor, aristois, impact, liquidbounce, rusherhack, future, inertia, kamiblue, salhack,
            konas, phobos, bleachhack, thunderhack, baritone, freecam, xray, killaura]

addons:
  # Checks added by addon plugins (see ADDONS.md) to turn off, by name, for example [FastBow].
  # /rageanticheat status lists every addon check. Players with rageanticheat.bypass.<name> skip one check.
  disabled: []

moderation:
  # Announce punishments to every player. false: only staff with rageanticheat.alerts see them.
  broadcast: true
  default-reason: "No reason given"
  # Commands muted players cannot use, so they cannot get around a mute with private messages.
  muted-blocked-commands: [msg, tell, w, whisper, me, r, reply, say, m, t]

chat:
  anti-spam:
    # Blocks chat spam. Private-message commands (moderation.muted-blocked-commands) count as chat.
    # Players with rageanticheat.chat.bypass are not limited.
    enabled: true
    # At most max-messages messages within window-seconds.
    max-messages: 5
    window-seconds: 5
    # The same message (ignoring case, spaces and punctuation) cannot be sent again within this many seconds. 0 = off.
    repeat-seconds: 30
    auto-mute:
      # Mute players whose messages were blocked <strikes> times within window-seconds.
      enabled: true
      strikes: 5
      window-seconds: 60
      duration: 10m

anti-bot:
  enabled: true
  # Accounts that may be online from one IP at the same time. 0 = no limit.
  max-accounts-per-ip: 3
  # Attack mode: when more than max-new-players first-time players connect within window-seconds,
  # first-time players are refused for attack-mode-seconds. Players who joined before can always join.
  max-new-players: 8
  window-seconds: 10
  attack-mode-seconds: 60

anti-vpn:
  # Refuse players who connect through a VPN or proxy. Uses proxycheck.io: each joining player's IP is
  # sent to that service (cached for cache-hours). Behind BungeeCord/Velocity, enable IP forwarding.
  enabled: false
  # Optional free key from proxycheck.io for a higher daily limit (100 lookups/day without one).
  api-key: ""
  # Let players join when the lookup fails (timeout, daily limit). false refuses them instead.
  allow-on-error: true
  cache-hours: 24
  # Names or UUIDs that may always join through a VPN.
  allowed-players: []

alts:
  # Link accounts that have joined from the same IP.
  enabled: true
  # Tell staff (and the Discord webhook "joins" event) when a player with alts joins.
  notify-staff: true
  # Refuse to let a player join from an IP that a banned account has used (ban evasion).
  # Off by default: families, schools and public Wi-Fi share IPs.
  block-banned-alts: false

freeze:
  # Commands a frozen player may still use, e.g. to talk to staff.
  allowed-commands: [msg, tell, r, reply]
  # Ban a frozen player who logs out. Staff are always alerted.
  ban-on-logout: false
  ban-duration: perm

discord:
  webhook:
    # Post alerts to a Discord channel. Create a webhook in Channel settings > Integrations > Webhooks.
    enabled: false
    url: ""
    username: "RageAnticheat"
    # Messages beyond this are dropped so a flood of alerts cannot get the webhook rate-limited.
    max-per-minute: 20
    # What to post: alerts (anticheat flags), punishments, joins (alts, VPN and bot blocks), exploits.
    events: [alerts, punishments, joins, exploits]

  bot:
    # A Discord bot to moderate the server with slash commands (/ban, /mute, /kick, /warn, /unban,
    # /unmute, /freeze, /clearchat, /profile, /history, /players). Create an application at
    # https://discord.com/developers/applications, add a bot, copy its token, and invite it with the
    # "bot" and "applications.commands" scopes. Keep the token secret: anyone with it controls the bot.
    enabled: false
    token: ""
    # Right-click the server / role / channel with Developer Mode on (Discord settings > Advanced) to copy IDs.
    guild-id: ""
    # Members with this role can use the moderation commands.
    staff-role-id: ""
    # Members with this role can also use /console, if allow-console is true.
    admin-role-id: ""
    # Allow /console, which runs any server command as the console. Only enable this if you trust
    # everyone with the admin role as much as server operators.
    allow-console: false
    # Channel for alert embeds (leave empty to not post), and which events to post there.
    alert-channel-id: ""
    events: [alerts, punishments, joins, exploits]
