name: RageAnticheat
version: ${version}
main: dev.rage.anticheat.RageAnticheat
api-version: '1.20'
description: Lightweight anti-cheat and moderation.

# Downloaded by Paper from Maven Central on first start, so the jar itself stays small.
libraries:
  - org.xerial:sqlite-jdbc:3.46.1.3
  - net.dv8tion:JDA:5.2.1

commands:
  rageanticheat:
    description: Manage RageAnticheat.
    usage: /rageanticheat <reload|status|reset <player>>
  ban:
    description: Ban a player, permanently or for a time.
    usage: /ban <player> [duration] [reason]
    aliases: [rban, tempban]
  mute:
    description: Mute a player, permanently or for a time.
    usage: /mute <player> [duration] [reason]
    aliases: [rmute, tempmute]
  kick:
    description: Kick a player.
    usage: /kick <player> [reason]
    aliases: [rkick]
  warn:
    description: Warn a player.
    usage: /warn <player> [reason]
    aliases: [rwarn]
  unban:
    description: Lift a player's ban.
    usage: /unban <player>
    aliases: [pardon, runban]
  unmute:
    description: Lift a player's mute.
    usage: /unmute <player>
    aliases: [runmute]
  clearchat:
    description: Clear the chat for everyone.
    usage: /clearchat
    aliases: [cc, chatclear]
  freeze:
    description: Freeze or unfreeze a player.
    usage: /freeze <player>
    aliases: [ss, unfreeze]
  profile:
    description: Show a player's profile, punishments and anticheat flags.
    usage: /profile <player>
    aliases: [lookup, info]
  alts:
    description: List accounts that share an IP with a player.
    usage: /alts <player>
  history:
    description: Show a player's punishment history.
    usage: /history <player>
    aliases: [punishments]
  maintenance:
    description: Turn maintenance mode on or off and manage who may join during it.
    usage: /maintenance <on|off|add|remove|list> [player]

permissions:
  rageanticheat.admin:
    description: Use /rageanticheat.
    default: op
  rageanticheat.alerts:
    description: Receive violation alerts and staff notices in chat.
    default: op
  rageanticheat.bypass:
    description: Skip all anticheat checks.
    default: false
  rageanticheat.exploits.bypass:
    description: Skip the crash-exploit limits (books, item data, signs).
    default: false
  rageanticheat.mod.*:
    description: Use every moderation command.
    default: op
    children:
      rageanticheat.mod.ban: true
      rageanticheat.mod.mute: true
      rageanticheat.mod.kick: true
      rageanticheat.mod.warn: true
      rageanticheat.mod.unban: true
      rageanticheat.mod.unmute: true
      rageanticheat.mod.clearchat: true
      rageanticheat.mod.history: true
      rageanticheat.mod.freeze: true
      rageanticheat.mod.alts: true
      rageanticheat.mod.profile: true
  rageanticheat.mod.exempt:
    description: Cannot be punished by other players (the console still can).
    default: false
  rageanticheat.maintenance:
    description: Use /maintenance.
    default: op
  rageanticheat.chat.bypass:
    description: Not limited by the chat spam filter.
    default: op
  rageanticheat.mod.clearchat.bypass:
    description: Keep your chat when it is cleared.
    default: op
